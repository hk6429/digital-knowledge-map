function transform(){$('#viewport').setAttribute('transform','translate('+pan.x+','+pan.y+') scale('+scale+')');for(const[id,g]of nodeElements){const n=byId.get(id),radius=[0,13,7,4.5,3.5,2.5][n.level],t=g.querySelector('text'),circles=g.querySelectorAll('circle');circles[0].setAttribute('r',(radius+7)/scale);circles[1].setAttribute('r',radius/scale);circles[1].setAttribute('vector-effect','non-scaling-stroke');t.setAttribute('y',(radius+14)/scale);t.style.fontSize=(n.level===1?13:11)/scale+'px';t.style.strokeWidth=2/scale+'px'}}

/* PHYSICS_START */

// Fixed-step spring simulation: visible links attract, nodes repel, friction settles.
function physicsStep(ns,ls,ps,pinned,energy=1){
 const forces=new Map(ns.map(n=>[n.id,{x:0,y:0}]));
 for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
  const a=ps.get(ns[i].id),b=ps.get(ns[j].id);
  let dx=b.x-a.x,dy=b.y-a.y;
  if(Math.abs(dx)+Math.abs(dy)<.001){dx=.1;dy=.1}
  const d=Math.hypot(dx,dy),f=Math.min(5,4200/Math.max(400,d*d));
  const fa=forces.get(ns[i].id),fb=forces.get(ns[j].id);
  fa.x-=dx/d*f;fa.y-=dy/d*f;fb.x+=dx/d*f;fb.y+=dy/d*f;
 }
 for(const l of ls){
  const a=ps.get(l.source),b=ps.get(l.target),dx=b.x-a.x,dy=b.y-a.y;
  const d=Math.max(.01,Math.hypot(dx,dy));
  const f=(d-(l.type==='分類'?85:180))*(l.type==='待確認'?.002:.014);
  const fa=forces.get(l.source),fb=forces.get(l.target);
  fa.x+=dx/d*f;fa.y+=dy/d*f;fb.x-=dx/d*f;fb.y-=dy/d*f;
 }
 let speed=0;
 for(const n of ns){
  const p=ps.get(n.id),f=forces.get(n.id);
  if(n.id===pinned||p.pinned){p.vx=0;p.vy=0;continue}
  p.vx=((p.vx||0)+(f.x+(650-p.x)*.0008)*energy)*.86;
  p.vy=((p.vy||0)+(f.y+(450-p.y)*.008)*energy)*.86;
  p.vx=Math.max(-14,Math.min(14,p.vx));p.vy=Math.max(-14,Math.min(14,p.vy));
  p.x+=p.vx;p.y+=p.vy;
  speed=Math.max(speed,Math.abs(p.vx),Math.abs(p.vy));
 }
 return speed;
}

/* PHYSICS_END */
function paint(){for(const[id,g]of nodeElements){const p=positions.get(id);g.setAttribute('transform','translate('+p.x+','+p.y+')');g.classList.toggle('pinned',!!p.pinned)}for(const[l,line]of edgeElements){const a=positions.get(l.source),b=positions.get(l.target);line.setAttribute('d',`M ${a.x} ${a.y} L ${b.x} ${b.y}`)}}
function centerGraph(){
 if(!active.ns.length){scale=1;pan={x:0,y:0};transform();return}
 const r=$('#map').getBoundingClientRect(),w=r.width,h=r.height;
 $('#map').setAttribute('viewBox','0 0 '+w+' '+h);
 const ps=active.ns.map(n=>positions.get(n.id)),minX=Math.min(...ps.map(p=>p.x))-90,maxX=Math.max(...ps.map(p=>p.x))+120,minY=Math.min(...ps.map(p=>p.y))-60,maxY=Math.max(...ps.map(p=>p.y))+65;
 const reserve=w>650?280:0,top=w>650?110:145;
 scale=Math.max(.12,Math.min(1.7,(w-reserve-40)/(maxX-minX),(h-top-85)/(maxY-minY)));
 pan={x:20+(w-reserve-40-(maxX-minX)*scale)/2-minX*scale,y:top+(h-top-85-(maxY-minY)*scale)/2-minY*scale};transform();
}
function updateLabels(){const level=Number($('#labels').value);$('#labelsout').textContent=level+' 層';for(const[id,g]of nodeElements)g.classList.toggle('label-hidden',byId.get(id).level>level)}
function highlight(id){
 const ids=new Set(id?[id]:[]);for(const l of active.ls)if(l.source===id||l.target===id){ids.add(l.source);ids.add(l.target)}

 for(const[l,e]of edgeElements){const yes=l.source===id||l.target===id;e.classList.toggle('dim',!!id&&!yes);e.classList.toggle('emphasis',!!id&&yes)}
}

function animate(time){raf=null;accumulator+=previous?Math.min(50,time-previous):16.67;previous=time;while(accumulator>=1000/60){energy=held?1:energy*.985;const speed=physicsStep(active.ns,active.ls,positions,held,energy);quiet=speed<.035&&!held?quiet+1:0;accumulator-=1000/60}paint();if(quiet<50)raf=requestAnimationFrame(animate);else previous=0}
function wake(){quiet=0;energy=1;if(raf===null){previous=0;accumulator=0;raf=requestAnimationFrame(animate)}}
function bindDrag(g,n){let pointer=null,last=null,moved=false,origin=null;const p=positions.get(n.id);
 const finish=e=>{if(e.pointerId!==pointer)return;const id=pointer;pointer=null;held=null;last=null;if(g.hasPointerCapture(id))g.releasePointerCapture(id);g.style.cursor='grab';wake();if(e.type==='pointerup'){if(moved){p.pinned=true;selected=n.id;detail(n);$('#status').textContent='已固定：'+n.label+'；雙擊或明細按鈕可解除'}else choose(n.id)}};
 g.addEventListener('pointerdown',e=>{if(e.button!==0||held!==null)return;e.stopPropagation();pointer=e.pointerId;held=n.id;last=point(e);origin=last;moved=false;p.vx=0;p.vy=0;g.setPointerCapture(pointer);g.style.cursor='grabbing';wake()});
 g.addEventListener('pointermove',e=>{if(e.pointerId!==pointer||!last)return;const q=point(e);if(Math.hypot(q.x-origin.x,q.y-origin.y)>4)moved=true;p.x+=(q.x-last.x)/scale;p.y+=(q.y-last.y)/scale;last=q;paint();wake()});

}

 }
