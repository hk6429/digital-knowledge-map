<div class="toolbar"><input id="search" type="search" placeholder="找關鍵字或專案，例如：評量、文豪" aria-label="搜尋關鍵字或專案"><label>紀錄月份 <select id="month"><option value="all">六至八月</option><option value="2026-06">六月</option><option value="2026-07">七月</option><option value="2026-08">八月</option></select></label><button id="reset">回到重心總覽</button></div>

<footer><p>重心與關鍵字是依專案用途整理的建議分類，不是用工具使用次數衡量人生，也不是因果或完成認證。</p><p>公開版保留六月至八月來源，不含私人原文、文件標題、網址與本機路徑；AI 輔助批改平台的規準、覆核與最終判斷仍由教師掌握。</p></footer>

<script>
'use strict';

let focus=null,key=null,selected=null,scale=1,pan={x:0,y:0},held=null,raf=null,energy=1,quiet=0,previous=0,accumulator=0,active={ns:[],ls:[]};
const anchors=[{x:210,y:155},{x:530,y:145},{x:790,y:230},{x:805,y:520},{x:525,y:570},{x:230,y:535},{x:130,y:330}];
const positions=new Map(),nodeElements=new Map(),edgeElements=[];
for(const n of D.nodes){const ti=D.themes.findIndex(t=>t.theme===n.theme),anchor=anchors[ti]||{x:500,y:350};n.anchor={...anchor};const siblings=D.nodes.filter(x=>x.theme===n.theme&&x.kind===n.kind),i=siblings.findIndex(x=>x.id===n.id),a=i*2.399963,r=n.kind==='重心'?0:n.kind==='關鍵字'?75:115+18*Math.sqrt(i);positions.set(n.id,{x:Math.max(90,Math.min(910,anchor.x+Math.cos(a)*r)),y:Math.max(85,Math.min(635,anchor.y+Math.sin(a)*r)),vx:0,vy:0})}
function el(tag,attrs={}){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function text(tag,value,parent,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;parent.append(e);return e}
function button(label,parent,fn){const b=text('button',label,parent);b.onclick=fn;return b}
function visible(){
 const month=$('#month').value,q=$('#search').value.trim().toLowerCase();
 const eligible=D.nodes.filter(n=>month==='all'||n.dates.some(day=>day.startsWith(month)));let ns;
 if(q){const hits=eligible.filter(n=>(n.label+' '+(n.originalLabel||'')).toLowerCase().includes(q)),ids=new Set(hits.map(n=>n.id));for(const n of hits){ids.add('theme-'+n.theme);if(n.keyword)ids.add(n.keyword)}ns=eligible.filter(n=>ids.has(n.id))}
 else if(key)ns=eligible.filter(n=>n.id===key||n.keyword===key||n.id==='theme-'+focus);
 else if(focus)ns=eligible.filter(n=>n.theme===focus);
 else ns=eligible;
 // Expand one bridge hop and its hierarchy, keeping focused topics connected.
 const base=new Set(ns.map(n=>n.keyword||n.id));
 const connected=new Set(ns.map(n=>n.id));
 for(const l of D.links.filter(l=>l.type==='待確認'&&(month==='all'||l.dates.some(d=>d.startsWith(month))))){if(base.has(l.source))connected.add(l.target);if(base.has(l.target))connected.add(l.source)}
 for(const n of eligible)if(connected.has(n.id)){connected.add('theme-'+n.theme);if(n.keyword)connected.add(n.keyword)}
 ns=eligible.filter(n=>connected.has(n.id));
 const ids=new Set(ns.map(n=>n.id));return{ns,ls:D.links.filter(l=>ids.has(l.source)&&ids.has(l.target)&&(month==='all'||l.dates.some(d=>d.startsWith(month))))};

function arrange(){
 let y=70;const center=ids=>ids.reduce((sum,id)=>sum+positions.get(id).y,0)/ids.length;
 for(const theme of D.themes){
  const keys=active.ns.filter(n=>n.theme===theme.theme&&n.level===2);
  for(const k of keys){const children=active.ns.filter(n=>n.keyword===k.id);
   const start=y;for(const n of children){positions.set(n.id,{x:650,y,vx:0,vy:0});y+=42}
   if(!children.length)y+=50;
   positions.set(k.id,{x:340,y:children.length?center(children.map(n=>n.id)):start,vx:0,vy:0});y+=24;
  }
  if(active.ns.some(n=>n.id===theme.id)){positions.set(theme.id,{x:70,y:keys.length?center(keys.map(n=>n.id)):y,vx:0,vy:0});if(!keys.length)y+=60}
  y+=34;
 }
 const height=Math.max(600,y+60);$('#map').setAttribute('viewBox','0 0 1000 '+height);
 for(const n of active.ns){n.anchor={x:positions.get(n.id).x,y:positions.get(n.id).y};n.boundsY=height-35}
}
function transform(){$('#viewport').setAttribute('transform','translate('+pan.x+','+pan.y+') scale('+scale+')')}
function point(e){const p=$('#map').createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform($('#map').getScreenCTM().inverse())}
/* PHYSICS_START */

// Fixed-step spring simulation: visible links attract, nodes repel, friction settles.
function physicsStep(ns,ls,ps,pinned,energy=1){
 const forces=new Map(ns.map(n=>[n.id,{x:0,y:0}]));
 for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
  const a=ps.get(ns[i].id),b=ps.get(ns[j].id);
  let dx=b.x-a.x,dy=b.y-a.y;
  if(Math.abs(dx)+Math.abs(dy)<.001){dx=.1;dy=.1}
  const d=Math.hypot(dx,dy),f=Math.min(4,6500/Math.max(900,d*d));
  const fa=forces.get(ns[i].id),fb=forces.get(ns[j].id);
  fa.x-=dx/d*f;fa.y-=dy/d*f;fb.x+=dx/d*f;fb.y+=dy/d*f;
 }
 for(const l of ls){
  const a=ps.get(l.source),b=ps.get(l.target),dx=b.x-a.x,dy=b.y-a.y;
  const d=Math.max(.01,Math.hypot(dx,dy));
  const anchored=ns.find(n=>n.id===l.source)?.anchor;
  const f=(d-(l.type==='分類'?280:180))*(anchored?(l.type==='待確認'?.0003:.002):.012);
  const fa=forces.get(l.source),fb=forces.get(l.target);
  fa.x+=dx/d*f;fa.y+=dy/d*f;fb.x-=dx/d*f;fb.y-=dy/d*f;
 }
 let speed=0;
 for(const n of ns){
  const p=ps.get(n.id),f=forces.get(n.id);
  if(n.id===pinned){p.vx=0;p.vy=0;continue}
  p.vx=((p.vx||0)+(f.x+((n.anchor?.x||500)-p.x)*(n.anchor?.5:.006))*energy)*.86;
  p.vy=((p.vy||0)+(f.y+((n.anchor?.y||350)-p.y)*(n.anchor?.5:.006))*energy)*.86;
  p.vx=Math.max(-14,Math.min(14,p.vx));p.vy=Math.max(-14,Math.min(14,p.vy));
  p.x+=p.vx;p.y+=p.vy;
  const minX=n.anchor?35:90,minY=n.anchor?35:85,maxY=n.boundsY||635;
  if(p.x<minX||p.x>910){p.x=Math.max(minX,Math.min(910,p.x));p.vx=0}
  if(p.y<minY||p.y>maxY){p.y=Math.max(minY,Math.min(maxY,p.y));p.vy=0}
  speed=Math.max(speed,Math.abs(p.vx),Math.abs(p.vy));
 }
 return speed;
}

/* PHYSICS_END */
function paint(){for(const[id,g]of nodeElements){const p=positions.get(id);g.setAttribute('transform','translate('+p.x+','+p.y+')')}for(const[l,line]of edgeElements){const a=positions.get(l.source),b=positions.get(l.target),bend=l.type==='待確認'?Math.max(170,a.x-100):(a.x+b.x)/2;line.setAttribute('d',`M ${a.x} ${a.y} C ${bend} ${a.y}, ${bend} ${b.y}, ${b.x} ${b.y}`)}}
function animate(time){raf=null;accumulator+=previous?Math.min(50,time-previous):16.67;previous=time;while(accumulator>=1000/60){energy=held?1:energy*.985;const speed=physicsStep(active.ns,active.ls,positions,held,energy);quiet=speed<.035&&!held?quiet+1:0;accumulator-=1000/60}paint();if(quiet<50)raf=requestAnimationFrame(animate);else previous=0}
function wake(){quiet=0;energy=1;if(raf===null){previous=0;accumulator=0;raf=requestAnimationFrame(animate)}}
function bindDrag(g,n){let pointer=null,last=null,moved=false,origin=null;const p=positions.get(n.id);
 const finish=e=>{if(e.pointerId!==pointer)return;const id=pointer;pointer=null;held=null;last=null;if(g.hasPointerCapture(id))g.releasePointerCapture(id);g.style.cursor='grab';wake();if(e.type==='pointerup'){if(moved){selected=n.id;detail(n);$('#status').textContent='已拉動：'+n.label}else choose(n.id)}};
 g.addEventListener('pointerdown',e=>{if(e.button!==0||held!==null)return;e.stopPropagation();pointer=e.pointerId;held=n.id;last=point(e);origin=last;moved=false;p.vx=0;p.vy=0;g.setPointerCapture(pointer);g.style.cursor='grabbing';wake()});
 g.addEventListener('pointermove',e=>{if(e.pointerId!==pointer||!last)return;const q=point(e);if(Math.hypot(q.x-origin.x,q.y-origin.y)>4)moved=true;p.x+=(q.x-last.x)/scale;p.y+=(q.y-last.y)/scale;last=q;paint();wake()});

}
function render(){
 held=null;active=visible();arrange();nodeElements.clear();edgeElements.length=0;const vp=$('#viewport');vp.replaceChildren();
 $('#counts').textContent=active.ns.length+' 點・'+active.ls.filter(l=>l.type==='待確認').length+' 條共現線索';$('#breadcrumb').textContent=focus?(themeById.get(focus).label+(key?' / '+byId.get(key).label:'')):'三層全貌｜上下、左右捲動查看';
 for(const l of active.ls){const target=byId.get(l.target),line=el('path',{class:'edge'+(l.type==='待確認'?' candidate':''),stroke:themeById.get(target.theme).color,role:'button',tabindex:0,'aria-label':byId.get(l.source).label+'連到'+target.label+'：'+l.type});const title=el('title');title.textContent=l.label+'：'+l.reason;line.append(title);line.onclick=()=>edgeDetail(l);line.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();edgeDetail(l)}};vp.append(line);edgeElements.push([l,line])}
 for(const n of active.ns){const color=themeById.get(n.theme).color,isTheme=n.kind==='重心',isKey=n.kind==='關鍵字',radius=isTheme?21:isKey?8:11;
 const g=el('g',{class:'node '+(isTheme?'theme':isKey?'keyword':'project')+(selected===n.id?' selected':''),role:'button',tabindex:0,'aria-label':n.label});
 g.append(el('circle',{r:isTheme?25:18,fill:'transparent','pointer-events':'all'}));g.append(el('circle',{r:radius,fill:color,opacity:isTheme?1:.75,stroke:'#fcfdf6','stroke-width':3}));const t=el('text',{x:radius+9,y:5,'text-anchor':'start'});t.textContent=n.label;g.append(t);const title=el('title');title.textContent=n.label+'｜第'+n.level+'層・'+n.kind;g.append(title);
 g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(n.id)}});bindDrag(g,n);vp.append(g);nodeElements.set(n.id,g)}
 if(!active.ns.length){const t=el('text',{x:500,y:340,'text-anchor':'middle'});t.textContent='這個月份或關鍵字沒有相符項目。';vp.append(t)}
 const list=$('#nodebuttons');list.replaceChildren();for(const n of active.ns)button(n.label,list,()=>choose(n.id));

}
function choose(id){const n=byId.get(id);if(!n)return;selected=id;
 if(n.kind==='重心'){focus=n.theme;key=null;$('#search').value=''}
 else if(n.kind==='關鍵字'){focus=n.theme;key=n.id;$('#search').value=''}

function relatedLinks(n){const ids=n.level===1?new Set(D.nodes.filter(c=>c.theme===n.theme&&c.level===2).map(c=>c.id)):new Set([n.keyword||n.id]);const month=$('#month').value;return D.links.filter(l=>l.type==='待確認'&&(ids.has(l.source)||ids.has(l.target))&&(month==='all'||l.dates.some(day=>day.startsWith(month))))}

function detail(n){const d=$('#detail');d.replaceChildren();text('span',n.kind,d,'badge');text('h2',n.label,d);text('p',n.description,d);
 if(n.kind==='重心'||n.kind==='關鍵字'){
 const children=D.nodes.filter(c=>(n.kind==='重心'?c.theme===n.theme&&c.kind==='關鍵字':c.keyword===n.id)&&($('#month').value==='all'||c.dates.some(day=>day.startsWith($('#month').value))));
 text('h3',n.kind==='重心'?'這個重心裡的關鍵字':'相關專案與實踐',d);const items=text('div','',d,'items');for(const c of children)button(c.label,items,()=>choose(c.id));
