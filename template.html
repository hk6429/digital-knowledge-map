</style></head><body>
<header><div class="eyebrow">教學・實踐・生活</div><h1>大乃的工作與生活知識圖譜</h1><p>2026 六月 — 八月｜<span id="range"></span></p><p>三層知識串接・點節點看內容・滑過看關聯</p></header>
<details class="controls" open><summary>圖譜控制</summary><nav id="themes" class="themes" aria-label="選擇工作與生活重心"></nav>
<div class="controlrow"><label for="depth">顯示到第</label><input id="depth" type="range" min="1" max="3" value="3"><output id="depthout">3 層</output></div>
<div class="controlrow"><label for="labels">標籤到第</label><input id="labels" type="range" min="0" max="3" value="2"><output id="labelsout">2 層</output></div>
<input id="search" type="search" placeholder="搜尋關鍵字或專案" aria-label="搜尋關鍵字或專案">
<label for="month" class="hint">紀錄月份</label><select id="month"><option value="all">六至八月</option><option value="2026-06">六月</option><option value="2026-07">七月</option><option value="2026-08">八月</option></select>
<div class="buttons"><button id="reflow">重排</button><button id="center">置中</button><button id="zoomin" aria-label="放大圖譜">＋</button><button id="zoomout" aria-label="縮小圖譜">−</button><button id="reset">重設</button><button id="help">讀圖說明</button></div>
<div class="layerlegend">大點：① 重心<br>中點：② 知識關鍵字<br>小點：③ 專案與實踐<br>實線：分類・虛線：共現待確認</div>
<details class="allnodes"><summary>節點清單（鍵盤也可操作）</summary><div id="nodebuttons"></div></details>
<details class="sourcepanel"><summary>來源與工具</summary><div id="sourcecontent"></div><button id="export">匯出去識別資料</button></details></details>
<main class="layout"><section class="stage" aria-label="動態知識網路"><div class="stagehead"><span id="breadcrumb">三層動態網路</span>｜<span id="counts"></span></div><div class="graphscroll"><svg id="map" viewBox="0 0 1400 900" aria-label="可拖曳、縮放的三層知識圖譜"><g id="viewport"></g></svg></div><div class="stagefoot"><span id="status" aria-live="polite">拖曳固定・雙擊解除・滾輪縮放・拖空白處平移</span></div></section></main>
<section class="drawer" id="drawer" aria-label="知識明細" hidden><button class="close" id="close">關閉明細</button><aside id="detail" aria-live="polite"></aside></section>
<script id="dataset" type="application/json">__DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.querySelector('#dataset').textContent),$=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
const byId=new Map(D.nodes.map(n=>[n.id,n])),themeById=new Map(D.themes.map(n=>[n.theme,n]));
let focus=null,key=null,selected=null,scale=1,pan={x:0,y:0},held=null,raf=null,energy=1,quiet=0,previous=0,accumulator=0,active={ns:[],ls:[]};
const enabledThemes=new Set(D.themes.map(t=>t.theme));
let layoutSeed=0;
const positions=new Map(),nodeElements=new Map(),edgeElements=[];
function seedPositions(){
 layoutSeed++;
 for(const n of D.nodes){
  const ti=D.themes.findIndex(t=>t.theme===n.theme),a=ti*Math.PI*2/7-.5;
  const siblings=D.nodes.filter(x=>x.theme===n.theme&&x.level===n.level),i=siblings.findIndex(x=>x.id===n.id);
  const jitter=i*2.399963+layoutSeed*.23,r=n.level===1?0:n.level===2?75:145+14*Math.sqrt(i);
  positions.set(n.id,{x:650+Math.cos(a)*270+Math.cos(jitter)*r,y:450+Math.sin(a)*230+Math.sin(jitter)*r,vx:0,vy:0,pinned:false});
 }
}
seedPositions();
function el(tag,attrs={}){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function text(tag,value,parent,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;parent.append(e);return e}
function button(label,parent,fn){const b=text('button',label,parent);b.onclick=fn;return b}
function visible(){
 const month=$('#month').value,q=$('#search').value.trim().toLowerCase();
 const eligible=D.nodes.filter(n=>enabledThemes.has(n.theme)&&n.level<=Number($('#depth').value)&&(month==='all'||n.dates.some(day=>day.startsWith(month))));let ns;
 if(q){const hits=eligible.filter(n=>(n.label+' '+(n.originalLabel||'')).toLowerCase().includes(q)),ids=new Set(hits.map(n=>n.id));for(const n of hits){ids.add('theme-'+n.theme);if(n.keyword)ids.add(n.keyword)}ns=eligible.filter(n=>ids.has(n.id))}
 else if(key)ns=eligible.filter(n=>n.id===key||n.keyword===key||n.id==='theme-'+focus);
 else if(focus)ns=eligible.filter(n=>n.theme===focus);
 else ns=eligible;
 // Expand one bridge hop and its hierarchy, keeping focused topics connected.
 const base=new Set(ns.map(n=>n.keyword||n.id));
 const connected=new Set(ns.map(n=>n.id));
 for(const l of D.links.filter(l=>l.type==='待確認'&&(month==='all'||l.dates.some(d=>d.startsWith(month))))){if(base.has(l.source))connected.add(l.target);if(base.has(l.target))connected.add(l.source)}
 for(const n of eligible)if(connected.has(n.id)){connected.add('theme-'+n.theme);if(n.keyword)connected.add(n.keyword)}
 ns=eligible.filter(n=>connected.has(n.id));
 const ids=new Set(ns.map(n=>n.id));return{ns,ls:D.links.filter(l=>ids.has(l.source)&&ids.has(l.target)&&(month==='all'||l.dates.some(d=>d.startsWith(month))))};
}
function transform(){$('#viewport').setAttribute('transform','translate('+pan.x+','+pan.y+') scale('+scale+')');for(const[id,g]of nodeElements){const n=byId.get(id),radius=n.level===1?13:n.level===2?7:3.5,t=g.querySelector('text'),circles=g.querySelectorAll('circle');circles[0].setAttribute('r',(radius+7)/scale);circles[1].setAttribute('r',radius/scale);circles[1].setAttribute('vector-effect','non-scaling-stroke');t.setAttribute('y',(radius+14)/scale);t.style.fontSize=(n.level===1?13:11)/scale+'px';t.style.strokeWidth=2/scale+'px'}}
function point(e){const p=$('#map').createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform($('#map').getScreenCTM().inverse())}
/* PHYSICS_START */

// Fixed-step spring simulation: visible links attract, nodes repel, friction settles.
function physicsStep(ns,ls,ps,pinned,energy=1){
 const forces=new Map(ns.map(n=>[n.id,{x:0,y:0}]));
 for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
  const a=ps.get(ns[i].id),b=ps.get(ns[j].id);
  let dx=b.x-a.x,dy=b.y-a.y;
  if(Math.abs(dx)+Math.abs(dy)<.001){dx=.1;dy=.1}
  const d=Math.hypot(dx,dy),f=Math.min(5,4200/Math.max(400,d*d));
  const fa=forces.get(ns[i].id),fb=forces.get(ns[j].id);
  fa.x-=dx/d*f;fa.y-=dy/d*f;fb.x+=dx/d*f;fb.y+=dy/d*f;
 }
 for(const l of ls){
  const a=ps.get(l.source),b=ps.get(l.target),dx=b.x-a.x,dy=b.y-a.y;
  const d=Math.max(.01,Math.hypot(dx,dy));
  const f=(d-(l.type==='分類'?85:180))*(l.type==='待確認'?.002:.014);
  const fa=forces.get(l.source),fb=forces.get(l.target);
  fa.x+=dx/d*f;fa.y+=dy/d*f;fb.x-=dx/d*f;fb.y-=dy/d*f;
 }
 let speed=0;
 for(const n of ns){
  const p=ps.get(n.id),f=forces.get(n.id);
  if(n.id===pinned||p.pinned){p.vx=0;p.vy=0;continue}
  p.vx=((p.vx||0)+(f.x+(650-p.x)*.0008)*energy)*.86;
  p.vy=((p.vy||0)+(f.y+(450-p.y)*.008)*energy)*.86;
  p.vx=Math.max(-14,Math.min(14,p.vx));p.vy=Math.max(-14,Math.min(14,p.vy));
  p.x+=p.vx;p.y+=p.vy;
  speed=Math.max(speed,Math.abs(p.vx),Math.abs(p.vy));
 }
 return speed;
}

/* PHYSICS_END */
function paint(){for(const[id,g]of nodeElements){const p=positions.get(id);g.setAttribute('transform','translate('+p.x+','+p.y+')');g.classList.toggle('pinned',!!p.pinned)}for(const[l,line]of edgeElements){const a=positions.get(l.source),b=positions.get(l.target);line.setAttribute('d',`M ${a.x} ${a.y} L ${b.x} ${b.y}`)}}
function centerGraph(){
 if(!active.ns.length){scale=1;pan={x:0,y:0};transform();return}
 const r=$('#map').getBoundingClientRect(),w=r.width,h=r.height;
 $('#map').setAttribute('viewBox','0 0 '+w+' '+h);
 const ps=active.ns.map(n=>positions.get(n.id)),minX=Math.min(...ps.map(p=>p.x))-90,maxX=Math.max(...ps.map(p=>p.x))+120,minY=Math.min(...ps.map(p=>p.y))-60,maxY=Math.max(...ps.map(p=>p.y))+65;
 const reserve=w>650?280:0,top=w>650?110:145;
 scale=Math.max(.12,Math.min(1.7,(w-reserve-40)/(maxX-minX),(h-top-85)/(maxY-minY)));
 pan={x:20+(w-reserve-40-(maxX-minX)*scale)/2-minX*scale,y:top+(h-top-85-(maxY-minY)*scale)/2-minY*scale};transform();
}
function updateLabels(){const level=Number($('#labels').value);$('#labelsout').textContent=level+' 層';for(const[id,g]of nodeElements)g.classList.toggle('label-hidden',byId.get(id).level>level)}
function highlight(id){
 const ids=new Set(id?[id]:[]);for(const l of active.ls)if(l.source===id||l.target===id){ids.add(l.source);ids.add(l.target)}
 for(const[n,g]of nodeElements){g.classList.toggle('dim',!!id&&!ids.has(n));g.classList.toggle('selected',n===selected)}
 for(const[l,e]of edgeElements){const yes=l.source===id||l.target===id;e.classList.toggle('dim',!!id&&!yes);e.classList.toggle('emphasis',!!id&&yes)}
}

function animate(time){raf=null;accumulator+=previous?Math.min(50,time-previous):16.67;previous=time;while(accumulator>=1000/60){energy=held?1:energy*.985;const speed=physicsStep(active.ns,active.ls,positions,held,energy);quiet=speed<.035&&!held?quiet+1:0;accumulator-=1000/60}paint();if(quiet<50)raf=requestAnimationFrame(animate);else previous=0}
function wake(){quiet=0;energy=1;if(raf===null){previous=0;accumulator=0;raf=requestAnimationFrame(animate)}}
function bindDrag(g,n){let pointer=null,last=null,moved=false,origin=null;const p=positions.get(n.id);
 const finish=e=>{if(e.pointerId!==pointer)return;const id=pointer;pointer=null;held=null;last=null;if(g.hasPointerCapture(id))g.releasePointerCapture(id);g.style.cursor='grab';wake();if(e.type==='pointerup'){if(moved){p.pinned=true;selected=n.id;detail(n);$('#status').textContent='已固定：'+n.label+'；雙擊或明細按鈕可解除'}else choose(n.id)}};
 g.addEventListener('pointerdown',e=>{if(e.button!==0||held!==null)return;e.stopPropagation();pointer=e.pointerId;held=n.id;last=point(e);origin=last;moved=false;p.vx=0;p.vy=0;g.setPointerCapture(pointer);g.style.cursor='grabbing';wake()});
 g.addEventListener('pointermove',e=>{if(e.pointerId!==pointer||!last)return;const q=point(e);if(Math.hypot(q.x-origin.x,q.y-origin.y)>4)moved=true;p.x+=(q.x-last.x)/scale;p.y+=(q.y-last.y)/scale;last=q;paint();wake()});
 for(const name of ['pointerup','pointercancel','lostpointercapture'])g.addEventListener(name,finish);
}
function render(){
 held=null;active=visible();nodeElements.clear();edgeElements.length=0;const vp=$('#viewport');vp.replaceChildren();
 $('#counts').textContent=active.ns.length+' 點・'+active.ls.filter(l=>l.type==='待確認').length+' 條共現線索';$('#breadcrumb').textContent=focus?(themeById.get(focus).label+(key?' / '+byId.get(key).label:'')):'三層動態網路';
 for(const l of active.ls){const target=byId.get(l.target),line=el('path',{class:'edge'+(l.type==='待確認'?' candidate':''),stroke:themeById.get(target.theme).color,role:'button',tabindex:0,'aria-label':byId.get(l.source).label+'連到'+target.label+'：'+l.type});const title=el('title');title.textContent=l.label+'：'+l.reason;line.append(title);line.onclick=()=>edgeDetail(l);line.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();edgeDetail(l)}};vp.append(line);edgeElements.push([l,line])}
 for(const n of active.ns){const color=themeById.get(n.theme).color,isTheme=n.kind==='重心',isKey=n.kind==='關鍵字',radius=isTheme?18:isKey?10:5;
 const g=el('g',{class:'node '+(isTheme?'theme':isKey?'keyword':'project')+(selected===n.id?' selected':''),role:'button',tabindex:0,'aria-label':n.label});
 g.append(el('circle',{r:isTheme?23:isKey?16:11,fill:'transparent','pointer-events':'all'}));g.append(el('circle',{class:'dot',r:radius,fill:color}));const t=el('text',{x:0,y:radius+16,'text-anchor':'middle'});t.textContent=n.label;g.append(t);const title=el('title');title.textContent=n.label+'｜第'+n.level+'層・'+n.kind;g.append(title);
 g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(n.id)}});g.addEventListener('mouseenter',()=>highlight(n.id));g.addEventListener('mouseleave',()=>highlight(selected));g.addEventListener('focus',()=>highlight(n.id));g.addEventListener('blur',()=>highlight(selected));g.addEventListener('dblclick',()=>{positions.get(n.id).pinned=false;wake();$('#status').textContent='已解除固定：'+n.label});bindDrag(g,n);vp.append(g);nodeElements.set(n.id,g)}
 if(!active.ns.length){const t=el('text',{x:500,y:340,'text-anchor':'middle'});t.textContent='這個月份或關鍵字沒有相符項目。';vp.append(t)}
 const list=$('#nodebuttons');list.replaceChildren();for(const n of active.ns)button(n.label,list,()=>choose(n.id));
 updateLabels();$('#depthout').textContent=$('#depth').value+' 層';
 transform();paint();wake();
}
function choose(id){const n=byId.get(id);if(!n)return;selected=id;detail(n);highlight(id);$('#status').textContent='目前探索：'+n.label;}
function relatedLinks(n){const ids=n.level===1?new Set(D.nodes.filter(c=>c.theme===n.theme&&c.level===2).map(c=>c.id)):new Set([n.keyword||n.id]);const month=$('#month').value;return D.links.filter(l=>l.type==='待確認'&&(ids.has(l.source)||ids.has(l.target))&&(month==='all'||l.dates.some(day=>day.startsWith(month))))}
function edgeDetail(l){$('#drawer').hidden=false;const d=$('#detail');d.replaceChildren();text('span',l.type==='分類'?'編輯分類':'共現線索・待確認',d,'badge');text('h2',byId.get(l.source).label+' ↔ '+byId.get(l.target).label,d);text('p',l.reason,d,'note');const month=$('#month').value;for(const e of (l.evidence||[]).filter(e=>month==='all'||e.dates.some(day=>day.startsWith(month))))text('p',byId.get(e.source).label+' ＋ '+byId.get(e.target).label+'：'+e.reason+'（六至八月整期統計；目前篩選只判斷有無該月紀錄。）',d,'source');button('探索「'+byId.get(l.source).label+'」',d,()=>choose(l.source));button('探索「'+byId.get(l.target).label+'」',d,()=>choose(l.target))}
function detail(n){$('#drawer').hidden=false;const d=$('#detail');d.replaceChildren();text('span',n.kind,d,'badge');text('h2',n.label,d);text('p',n.description,d);button('解除這個節點的固定',d,()=>{positions.get(n.id).pinned=false;wake();$('#status').textContent='已解除固定：'+n.label});
 if(n.kind==='重心'||n.kind==='關鍵字'){
 const children=D.nodes.filter(c=>(n.kind==='重心'?c.theme===n.theme&&c.kind==='關鍵字':c.keyword===n.id)&&($('#month').value==='all'||c.dates.some(day=>day.startsWith($('#month').value))));
 text('h3',n.kind==='重心'?'這個重心裡的關鍵字':'相關專案與實踐',d);const items=text('div','',d,'items');for(const c of children)button(c.label,items,()=>choose(c.id));
 text('p','這是依專案用途整理的建議分類。日期保留原紀錄，不代表每天都執行了所有工作。',d,'note');
 }else{
 text('p','連回：'+themeById.get(n.theme).label+' → '+byId.get(n.keyword).label,d);button('回到「'+byId.get(n.keyword).label+'」',d,()=>choose(n.keyword));
 const sources=n.sources.filter(s=>$('#month').value==='all'||s.date.startsWith($('#month').value));text('h3','這項工作留下的紀錄',d);text('p','日期範圍：'+n.dates[0]+' — '+n.dates.at(-1),d);text('p','來源：'+[...new Set(sources.map(s=>s.kind))].join('、'),d);
 const list=text('details','',d);text('summary','查看 '+sources.length+' 筆日期／來源彙總',list);for(const s of sources)text('div',s.date+'｜'+s.kind+'｜'+s.file,list,'source');
 text('p','Claude、Codex 與 Chrome 只標明紀錄從哪裡來，不是知識本身，也不是完成認證。',d,'note');
 }
 const connections=relatedLinks(n);text('h3','串到其他知識（共現待確認）',d);if(!connections.length)text('p','現有共現資料尚未提供跨知識連線；仍保留上層分類連接，不硬補關係。',d);
 const items=text('div','',d,'items');for(const l of connections)button(byId.get(l.source).label+' ↔ '+byId.get(l.target).label,items,()=>edgeDetail(l));
 const related=new Set([n.id,n.keyword,'theme-'+n.theme]);for(const l of connections){related.add(l.source);related.add(l.target)}
 for(const[id,g]of nodeElements)g.classList.toggle('dim',!related.has(id)&&byId.get(id).keyword!==(n.keyword||n.id)&&!(n.level===1&&byId.get(id).theme===n.theme));
 for(const[l,line]of edgeElements){const relevant=connections.includes(l)||l.source===n.id||l.target===n.id||l.source===n.keyword;line.classList.toggle('dim',!relevant);line.classList.toggle('emphasis',relevant)}
 }
function welcome(){const d=$('#detail');d.replaceChildren();text('span','先看重心，再看專案',d,'badge');text('h2','我把時間放在哪裡？',d);text('p','從國文老師、資訊組長、自我領導課程與創作生活，看三個月的累積。',d);
 text('h3','三層，同一張網',d);text('p','① 生活與工作重心：我在意什麼？\n② 知識關鍵字：累積哪些方法？\n③ 專案與實踐：在哪裡實際運用？',d,'steps');

 text('p','節點大小代表三層；顯示層級控制節點數，標籤層級控制文字量。滑過節點突顯一跳關聯，點選開啟明細。拖曳後固定，雙擊解除；重排會清除全部固定位置。',d);
 text('p','工具留在「來源與工具」。Claude 不再是圖的中心，不會因為紀錄多就把每個專案拉向它。',d,'note');
 text('h3','生活紀錄的邊界',d);text('p','目前生活面的資料主要是理財紀錄；沒有足夠資料的家庭、健康或其他生活面向，不先替你補上。',d);
 text('p','7 個重心・'+D.stats.keywords+' 個知識關鍵字・70 個專案與實踐・'+D.stats.knowledge_bridges+' 條知識共現線索。完整期間的主圖已接成一張網；單月缺少紀錄時，不強行補線。',d);
}
function reset(){focus=null;key=null;selected=null;$('#search').value='';$('#month').value='all';$('#depth').value='3';$('#labels').value='2';enabledThemes.clear();for(const t of D.themes)enabledThemes.add(t.theme);for(const input of $('#themes').querySelectorAll('input'))input.checked=true;seedPositions();render();centerGraph();welcome();$('#drawer').hidden=true;$('#status').textContent='拖曳固定・雙擊解除・滾輪縮放・拖空白處平移'}
let start=null;$('#map').addEventListener('pointerdown',e=>{if(e.target.closest('.node,.edge'))return;start=point(e);$('#map').setPointerCapture(e.pointerId)});$('#map').addEventListener('pointermove',e=>{if(start){const p=point(e);pan.x+=p.x-start.x;pan.y+=p.y-start.y;start=p;transform()}});for(const event of ['pointerup','pointercancel','lostpointercapture'])$('#map').addEventListener(event,()=>start=null);
$('#map').addEventListener('wheel',e=>{e.preventDefault();const p=point(e),next=Math.max(.1,Math.min(5,scale*(e.deltaY<0?1.08:.92))),ratio=next/scale;pan={x:p.x-(p.x-pan.x)*ratio,y:p.y-(p.y-pan.y)*ratio};scale=next;transform()},{passive:false});
$('#reset').onclick=reset;$('#center').onclick=centerGraph;
function zoomBy(ratio){const r=$('#map').getBoundingClientRect(),x=r.width/2,y=r.height/2,next=Math.max(.1,Math.min(5,scale*ratio));ratio=next/scale;pan={x:x-(x-pan.x)*ratio,y:y-(y-pan.y)*ratio};scale=next;transform()}
$('#zoomin').onclick=()=>zoomBy(1.4);$('#zoomout').onclick=()=>zoomBy(1/1.4);
$('#reflow').onclick=()=>{seedPositions();render();centerGraph();$('#status').textContent='已重新排列，所有固定位置已解除'};
$('#help').onclick=()=>{welcome();$('#drawer').hidden=false};
$('#close').onclick=()=>{$('#drawer').hidden=true;selected=null;highlight(null)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#close').click()});

$('#search').oninput=filterChanged;$('#month').oninput=filterChanged;$('#depth').oninput=filterChanged;$('#labels').oninput=updateLabels;
for(const t of D.themes){const label=text('label','',$('#themes')),input=document.createElement('input');input.type='checkbox';input.checked=true;input.setAttribute('aria-label',t.label);label.append(input);const dot=text('i','',label);dot.style.background=t.color;text('span',t.label,label);input.onchange=()=>{if(input.checked)enabledThemes.add(t.theme);else enabledThemes.delete(t.theme);filterChanged()}}

text('p','Claude 文件 '+D.stats.claude_notes+' 份、Codex／每日筆記 '+D.stats.codex_notes+' 份；'+D.stats.claude_sessions+' 個 Claude 工作階段索引；'+D.stats.browser_visits+' 筆 Chrome 造訪。',sc);
text('p','來源工具：'+D.tools.map(n=>n.label).join('、'),sc);text('p','未進主圖的待整理索引：'+D.unmapped.map(n=>n.label).join('、')+'。全部保留於匯出資料。',sc);
text('p','這是現存來源的整理，不是三個月所有操作的完整還原。',sc);
